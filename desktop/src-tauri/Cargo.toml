# Version source of truth: tauri.conf.json. Keep this version, package.json and src/version.ts in step.
[package]
name = "fab-intel"
version = "0.1.1"
description = "FAB Intel desktop"
edition = "2021"

[lib]
name = "fab_intel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fab-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
