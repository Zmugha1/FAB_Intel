[package]
name = "fab-core"
version = "0.1.0"
edition = "2021"
description = "FAB Intel desktop: database, sign-in, quotes, brief and ROI. No UI code."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Password hashes, same crate and version as the MVP Hub (DD-ADR-073).
argon2 = "=0.5.3"
# Turns on the operating system random source for salts. The Hub gets this through another crate.
password-hash = { version = "0.5", features = ["getrandom"] }

[dev-dependencies]
